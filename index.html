<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Egipto Antiguo AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif}.hud{position:fixed;z-index:10;left:10px;right:10px;top:10px;text-align:center;pointer-events:none}.msg{display:inline-block;background:#fff8e8e8;color:#3b2a18;padding:9px 12px;border-radius:14px;font-weight:700}.panel{position:fixed;z-index:12;left:12px;right:12px;bottom:14px;background:#fffdf4ee;border-radius:16px;padding:12px;box-shadow:0 3px 16px #0003;display:none}.panel button{float:right;border:0;border-radius:10px;padding:8px 12px;font-weight:700}.panel h3{margin:0 0 6px}.panel p{margin:0;line-height:1.35}.tip{font-size:12px;margin-top:6px;color:#604d36}
</style>
</head>
<body>
<div class="hud"><div id="status" class="msg">Permití la cámara y apuntá a la lámina de Egipto</div></div>
<div id="panel" class="panel"><button id="close">Cerrar</button><h3 id="ptitle"></h3><p id="ptext"></p><div class="tip">Tocá otro símbolo para seguir explorando.</div></div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-assets></a-assets>
<a-camera position="0 0 0" look-controls="enabled:false" cursor="fuse:false; rayOrigin:mouse" raycaster="far:10000; objects:.clickable"></a-camera>
<a-entity mindar-image-target="targetIndex:0" id="target">
  <a-entity position="0 0 0.08">
    <a-cone class="clickable" data-key="piramide" position="0 0.03 0" radius-bottom="0.28" radius-top="0" height="0.34" color="#d8ad62" rotation="0 0 0"></a-cone>
    <a-text value="TOCA LA PIRAMIDE" position="0 -0.24 0.02" align="center" width="1.1" color="#17324d"></a-text>
  </a-entity>
  <a-circle class="clickable" data-key="faraon" position="-0.34 0.27 0.05" radius="0.07" color="#e0b84e"></a-circle>
  <a-text value="FARAON" position="-0.34 0.17 0.06" align="center" width="0.6" color="#ffffff"></a-text>
  <a-circle class="clickable" data-key="sarcófago" position="0.34 0.27 0.05" radius="0.07" color="#3f8e9a"></a-circle>
  <a-text value="SARCÓFAGO" position="0.34 0.17 0.06" align="center" width="0.6" color="#ffffff"></a-text>
  <a-circle class="clickable" data-key="jeroglificos" position="-0.34 -0.25 0.05" radius="0.07" color="#8f6a3b"></a-circle>
  <a-text value="JEROGLIFICOS" position="-0.34 -0.35 0.06" align="center" width="0.6" color="#ffffff"></a-text>
  <a-circle class="clickable" data-key="desafio" position="0.34 -0.25 0.05" radius="0.07" color="#6c5aa7"></a-circle>
  <a-text value="DESAFIO" position="0.34 -0.35 0.06" align="center" width="0.6" color="#ffffff"></a-text>
</a-entity>
</a-scene>
<script>
const info={
 piramide:['La Gran Pirámide','Las pirámides eran monumentos funerarios. La Gran Pirámide de Guiza fue construida durante el reinado del faraón Keops.'],
 faraon:['El faraón','Era el gobernante de Egipto y ocupaba el centro de la organización política y religiosa del reino.'],
 'sarcófago':['El sarcófago','Era un recipiente funerario donde se colocaba el cuerpo preparado del difunto. Algunos estaban ricamente decorados.'],
 jeroglificos:['Jeroglíficos','La escritura jeroglífica combinaba signos que podían representar sonidos, palabras e ideas. Se utilizó en monumentos y textos religiosos.'],
 desafio:['Desafío del arqueólogo','¿Qué función tenían las pirámides? ¿Quién era el faraón? ¿Para qué servía un sarcófago? Respondé las tres antes de terminar la exploración.']
};
const panel=document.querySelector('#panel'), title=document.querySelector('#ptitle'), text=document.querySelector('#ptext'), status=document.querySelector('#status');
document.querySelector('#close').addEventListener('click',()=>panel.style.display='none');
document.querySelectorAll('.clickable').forEach(el=>el.addEventListener('click',()=>{const d=info[el.dataset.key]; title.textContent=d[0]; text.textContent=d[1]; panel.style.display='block';}));
const target=document.querySelector('#target'); target.addEventListener('targetFound',()=>status.textContent='¡Egipto encontrado! Tocá los símbolos'); target.addEventListener('targetLost',()=>status.textContent='Volvé a apuntar a la lámina de Egipto');
</script>
</body></html>
